<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA – Login</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #050810;
            --bg-secondary: #0a0e17;
            --bg-card: rgba(13, 18, 30, 0.85);
            --cyan: #00f0ff;
            --cyan-dim: rgba(0, 240, 255, 0.15);
            --green: #00ff88;
            --red: #ff3366;
            --text: #e0e6f0;
            --text-dim: #6b7a99;
            --border: rgba(0, 240, 255, 0.12);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background grid */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridScroll 20s linear infinite;
        }

        @keyframes gridScroll {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 15s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(0, 240, 255, 0.15);
            top: 10%;
            left: 10%;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(0, 255, 136, 0.1);
            bottom: 10%;
            right: 10%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(255, 51, 102, 0.08);
            top: 50%;
            left: 50%;
            animation-delay: -10s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.05);
            }

            66% {
                transform: translate(-20px, 30px) scale(0.95);
            }
        }

        /* Scan line */
        .scanline {
            position: fixed;
            inset: 0;
            background: linear-gradient(transparent, transparent 50%, rgba(0, 240, 255, 0.02) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 40px rgba(0, 240, 255, 0.05),
                0 25px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: cardSlideUp 0.8s ease-out;
        }

        @keyframes cardSlideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-section img {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.3));
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%,
            100% {
                filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.3));
            }

            50% {
                filter: drop-shadow(0 0 35px rgba(0, 240, 255, 0.6));
            }
        }

        .logo-section h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--cyan), var(--green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 6px;
            margin-bottom: 6px;
        }

        .logo-section p {
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--cyan);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px var(--cyan-dim), 0 0 20px rgba(0, 240, 255, 0.1);
            background: rgba(0, 240, 255, 0.06);
        }

        .input-group input::placeholder {
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 255, 136, 0.15));
            border: 1px solid var(--cyan);
            border-radius: 8px;
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(0, 255, 136, 0.25));
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-msg {
            background: rgba(255, 51, 102, 0.1);
            border: 1px solid rgba(255, 51, 102, 0.3);
            color: var(--red);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-align: center;
            animation: shake 0.5s ease-out;
        }

        .error-msg i {
            margin-right: 6px;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        .footer-info {
            text-align: center;
            margin-top: 24px;
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .footer-info span {
            color: var(--cyan);
        }

        /* Typing cursor effect */
        .typing-cursor::after {
            content: '▊';
            animation: blink 1s infinite;
            color: var(--cyan);
            font-size: 0.7em;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="scanline"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <img src="/static/img/logo.png" alt="NETRA Logo">
                <h1>NETRA</h1>
                <p>Network Event & Threat Response Analyst</p>
            </div>

            {% if error %}
            <div class="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> {{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Enter admin username" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-login">Authenticate <i class="fa-solid fa-arrow-right"></i></button>
            </form>

            <div class="footer-info">
                <span>NETRA</span> v{{ version }} · Secured Access · Developed by <span>MintFire</span>
            </div>
        </div>
    </div>
</body>

</html>
